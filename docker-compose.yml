version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: limousine_db
      POSTGRES_USER: limousine
      POSTGRES_PASSWORD: limousine
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  backend:
    build: ./backend
    env_file:
      - backend/.env.example
    depends_on:
      - postgres
  frontend:
    build: ./frontend
    depends_on:
      - backend
  gateway:
    image: nginx:alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - '8080:80'
    depends_on:
      - backend
      - frontend
volumes:
  pgdata:
